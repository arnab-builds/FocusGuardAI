<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FocusGuard AI</title>
    <style>
        :root{
            --bg:#0f1724; /* dark fallback not used in popup but keep theme */
            --white:#ffffff;
            --muted:#94a3b8;
            --panel:#ffffff;
            --surface:#f8fafc;
            --accent:#6366f1; /* indigo-500 */
            --accent-600:#4f46e5;
            --danger:#ef4444;
            --radius:14px;
            --shadow:0 6px 18px rgba(15,23,42,0.12);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        }

        html,body{
            height:100%;
            margin:0;
            padding:0;
            background:var(--surface);
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
        }

        /* Root popup container sized for extension (~380x600) */
        .popup-root{
            width:100%;
            max-width:380px;
            height:600px;
            box-sizing:border-box;
            padding:12px;
            display:flex;
            flex-direction:column;
            gap:10px;
        }

        /* Card like panel */
        .panel{
            background:var(--panel);
            border-radius:12px;
            box-shadow:var(--shadow);
            overflow:hidden;
            display:flex;
            flex-direction:column;
            height:100%;
        }

        /* Header - compact */
        .header{
            display:flex;
            align-items:center;
            gap:10px;
            padding:10px 12px;
            border-bottom:1px solid #eef2ff;
            background:linear-gradient(90deg, rgba(99,102,241,0.04), rgba(99,102,241,0.02));
        }

        .brand{
            display:flex;
            align-items:center;
            gap:8px;
        }

        .logo{
            height:34px;
            width:34px;
            border-radius:10px;
            background:linear-gradient(135deg,var(--accent),var(--accent-600));
            display:inline-flex;
            align-items:center;
            justify-content:center;
            color:var(--white);
            font-weight:700;
            box-shadow:0 6px 14px rgba(79,70,229,0.12);
            font-size:14px;
        }

        .title{font-size:14px;color:#0f1724;font-weight:600}
        .subtitle{font-size:11px;color:var(--muted);margin-top:2px}

        .header-actions{margin-left:auto;display:flex;align-items:center;gap:8px}

        /* Content area with messages or dashboard */
        .content{
            padding:12px;
            flex:1 1 auto;
            overflow:hidden;
            display:flex;
            flex-direction:column;
            gap:8px;
        }

        /* Scrollable message area */
        .messages{
            flex:1 1 auto;
            overflow:auto;
            padding-right:6px;
            display:flex;
            flex-direction:column;
            gap:8px;
        }

        .message-row{display:flex;gap:8px;align-items:flex-start}
        .msg-avatar{height:30px;width:30px;border-radius:8px;background:var(--accent);color:var(--white);display:inline-flex;align-items:center;justify-content:center;font-size:13px}
        .msg-bubble{background:#f1f5f9;padding:8px 10px;border-radius:10px;max-width:82%;font-size:13px;color:#0f1724}
        .msg-bubble.assistant{background:linear-gradient(90deg,var(--accent),var(--accent-600));color:var(--white)}

        /* suggestion chips */
        .chips{display:flex;flex-wrap:wrap;gap:8px}
        .chip{padding:6px 10px;border-radius:999px;background:#f1f5f9;color:#0f1724;font-size:12px;cursor:pointer;border:1px solid #e6eefc;transition:transform .12s ease,box-shadow .12s}
        .chip:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(15,23,42,0.06)}

        /* Composer fixed at bottom of panel */
        .composer{
            border-top:1px solid #eef2ff;
            padding:10px;
            display:flex;
            gap:8px;
            align-items:center;
        }

        .input-wrap{flex:1;display:flex;gap:8px;align-items:center}
        .input{
            flex:1;border-radius:999px;border:1px solid #e6eefc;padding:10px 14px;font-size:13px;outline:none;background:transparent;box-shadow:none;transition:box-shadow .12s ease;border-radius:999px
        }

        .send-btn{
            width:44px;height:44px;border-radius:999px;border:none;background:linear-gradient(90deg,var(--accent),var(--accent-600));color:white;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 18px rgba(79,70,229,0.18)
        }

        /* Login specific */
        #loginContainer{display:flex;flex-direction:column;gap:10px;padding:18px}
        .form-input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #e6eefc;background:white;outline:none;font-size:13px}
        .primary-btn{background:linear-gradient(90deg,var(--accent),var(--accent-600));color:white;padding:10px;border-radius:10px;border:none;cursor:pointer;font-weight:600}

        /* Dashboard small status */
        .status-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 8px;border-radius:999px;background:#ecfdf5;color:#065f46;font-weight:600;font-size:13px}

        /* Utility */
        .hidden{display:none}

        /* Ensure no element overflows popup bounds */
        *{box-sizing:border-box}
    </style>
</head>

<body>
    <div class="popup-root">
        <div class="panel" role="application">
            <!-- Header -->
            <div class="header">
                <div class="brand">
                    <div class="logo">FG</div>
                    <div>
                        <div class="title">FocusGuard AI</div>
                        <div class="subtitle">Personalized productivity assistant</div>
                    </div>
                </div>

                <div class="header-actions">
                    <!-- reserved for actions -->
                </div>
            </div>

            <!-- Main content area -->
            <div class="content">
                <!-- LOGIN view (preserve IDs) -->
                <div id="loginContainer">
                    <div style="text-align:center;margin-bottom:6px">
                        <strong style="font-size:16px;color:#0f1724">Welcome</strong>
                        <div style="font-size:12px;color:var(--muted);margin-top:4px">Sign in to access AI features</div>
                    </div>

                    <input id="username" class="form-input" type="text" placeholder="Username" />
                    <input id="password" class="form-input" type="password" placeholder="Password" />

                    <button id="loginBtn" class="primary-btn">Sign in</button>
                    <div id="message" style="font-size:13px;color:#ef4444;min-height:18px"></div>
                </div>

                <!-- DASHBOARD view (preserve ID) -->
                <div id="dashboardContainer" class="hidden" aria-hidden="true">
                    <!-- compact greeting -->
                    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
                        <div style="display:flex;gap:10px;align-items:center">
                            <div class="msg-avatar">AI</div>
                            <div>
                                <div style="font-weight:600">Hi — I'm FocusGuard AI</div>
                                <div style="font-size:12px;color:var(--muted)">How can I help you stay focused today?</div>
                            </div>
                        </div>
                        <div style="display:flex;align-items:center;gap:8px">
                            <div class="status-pill">🟢 Tracking Active</div>
                            <button id="logoutBtn" class="primary-btn" style="padding:6px 10px;font-size:12px;margin-left:6px;">Logout</button>
                        </div>
                    </div>

                    <!-- messages -->
                    <div class="messages" id="messagesArea">
                        <div class="message-row">
                            <div class="msg-avatar">AI</div>
                            <div class="msg-bubble assistant">Welcome back — try asking for a productivity plan.</div>
                        </div>
                    </div>

                    <!-- suggestion chips -->
                    <div class="chips" id="suggestions">
                        <div class="chip">Create a Focus Plan</div>
                        <div class="chip">Set Weekly Goal</div>
                        <div class="chip">Show Today’s Summary</div>
                    </div>
                </div>
            </div>

            <!-- Composer stays visible and fixed at bottom of panel -->
            <div class="composer">
                <div class="input-wrap">
                    <input id="composerInput" class="input" placeholder="Ask FocusGuard AI..." aria-label="Message input" />
                </div>
                <button class="send-btn" id="sendBtn" title="Send">➤</button>
            </div>
        </div>
    </div>

    <script type="module" src="popup.js"></script>
</body>

</html>
