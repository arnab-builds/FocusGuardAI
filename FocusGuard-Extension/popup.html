<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>FocusGuard AI</title>

    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        #dashboardContainer p {
            text-align: center;
            font-weight: bold;
            color: green;
            margin: 20px 0;
        }
    </style>
</head>

<body>

    <div id="loginContainer">

        <h2>FocusGuard AI</h2>

        <input
            type="text"
            id="username"
            placeholder="Username"
        />

        <input
            type="password"
            id="password"
            placeholder="Password"
        />

        <button id="loginBtn">
            Login
        </button>

        <div id="message"></div>

    </div>

    <div
        id="dashboardContainer"
        style="display:none;"
    >

        <h2>FocusGuard AI</h2>

        <p>
            🟢 Tracking Active
        </p>

        <button id="logoutBtn">
            Logout
        </button>

    </div>

    <script type="module" src="popup.js"></script>

</body>

</html>
